version: "3.9"

# Yerel geliştirme altyapısı: MySQL + MinIO (S3 uyumlu depolama)
# Kullanım: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: filomonline-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-filom_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-filomonline}
      MYSQL_USER: ${MYSQL_USER:-filom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-filom_dev}
    ports:
      - "3306:3306"
    volumes:
      - ./.mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_turkish_ci

  minio:
    image: minio/minio:latest
    container_name: filomonline-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-filomadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-filomadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web konsolu
    volumes:
      - ./.minio-data:/data
    command: server /data --console-address ":9001"
